uthentication**\n              - Required scope: `read:gameStats`.\n\n              **Path**\n              - `{{statInternalName}}` - The internal name of the stat.\n\n              **Query**\n              - `page` (optional, default `0`) - The current pagination index.\n              - `playerId` (optional) - Filter snapshots by this player ID.\n              - `startDate` (optional) - UTC date (YYYY-MM-DD), ISO 8601 datetime, or millisecond timestamp.\n              - `endDate` (optional) - Same format as `startDate`.\n          - info:\n              name: Stats - track\n              type: http\n              seq: 7\n            http:\n              method: PUT\n              url: '{{baseUrl}}/v1/game-stats/:statInternalName'\n              params:\n                - name: statInternalName\n                  value: '{{statInternalName}}'\n                  type: path\n              body:\n                type: json\n                data: |-\n                  {\n                    \"change\": 5\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Update a stat value. Set the `X-Talo-Continuity-Timestamp` header (milliseconds since epoch) to back-date the resulting snapshot (the API key must have the `write:continuityRequests` scope, and the timestamp must be in the past) - use this to record a stat change that occurred before the request.\n\n              **Authentication**\n              - Required scope: `write:gameStats`.\n              - Authenticated by: `X-Talo-Alias`.\n\n              **Path**\n              - `{{statInternalName}}` - The internal name of the stat.\n\n              **Body**\n              - `change` - The amount to add to the current value (can be negative).\n  - info:\n      name: Admin API\n      type: folder\n      seq: 2\n    request:\n      auth:\n        type: bearer\n        token: '{{adminApiKey}}'\n    docs:\n      content: |\n        The **Admin API** lets you programmatically manage your game data using admin API keys scoped to your game. These routes live under the `/admin/v1` prefix and use a separate admin API key: `{{adminApiKey}}`.\n\n        See the [Admin API reference](https://docs.trytalo.com/admin/authentication) for more details.\n      type: text/markdown\n    items:\n      - info:\n          name: Leaderboards\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |\n            Admin endpoints for creating, updating and managing leaderboards.\n\n            Authenticate with an admin API key that has the `read:leaderboards` and `write:leaderboards` scopes.\n          type: text/markdown\n        items:\n          - info:\n              name: Admin Leaderboards - create\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{baseUrl}}/admin/v1/leaderboards'\n              body:\n                type: json\n                data: |-\n                  {\n                    \"internalName\": \"highscores\",\n                    \"name\": \"Highscores\",\n                    \"sortMode\": \"desc\",\n                    \"unique\": true,\n                    \"refreshInterval\": \"never\"\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Create a leaderboard.\n\n              **Authentication**\n              - Required scope: `write:leaderboards`.\n\n              **Body**\n              - `internalName` - The internal name of the leaderboard.\n              - `name` - The display name of the leaderboard.\n              - `sortMode` - How entries are sorted: `asc` or `desc`.\n              - `unique` - Whether each player can only have a single entry.\n              - `refreshInterval` (optional) - How often the leaderboard resets: `never`, `daily`, `weekly`, `monthly` or `yearly`.\n              - `uniqueByProps` (optional) - Whether entries are unique based on their props.\n          - info:\n              name: Admin Leaderboards - list\n              type: http\n              seq: 2\n            http:\n              method: GET\n              url: '{{baseUrl}}/admin/v1/leaderboards'\n              params:\n                - name: internalName\n                  value: ''\n                  type: query\n                  disabled: true\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              List all leaderboards.\n\n              **Authentication**\n              - Required scope: `read:leaderboards`.\n\n              **Query**\n              - `internalName` (optional) - Filter leaderboards by internal name.\n          - info:\n              name: Admin Leaderboards - list entries\n              type: http\n              seq: 3\n            http:\n              method: GET\n              url: '{{baseUrl}}/admin/v1/leaderboards/:leaderboardId/entries'\n              params:\n                - name: leaderboardId\n                  value: '{{leaderboardId}}'\n                  type: path\n                - name: page\n                  value: '0'\n                  type: query\n                - name: aliasId\n                  value: '{{aliasId}}'\n                  type: query\n                  disabled: true\n                - name: withDeleted\n                  value: '0'\n                  type: query\n                  disabled: true\n                - name: propKey\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: propValue\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: startDate\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: endDate\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: aliasService\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: playerId\n                  value: '{{playerId}}'\n                  type: query\n                  disabled: true\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              List a leaderboard's entries. 50 results are returned per page.\n\n              **Authentication**\n              - Required scope: `read:leaderboards`.\n\n              **Path**\n              - `{{leaderboardId}}` - The ID of the leaderboard.\n\n              **Query**\n              - `page` (optional, default `0`) - The current pagination index (starting at 0).\n              - `aliasId` (optional) - Only return entries for this alias ID.\n              - `withDeleted` (optional) - Include entries that were deleted by a refresh interval (`0` or `1`).\n              - `propKey` (optional) - Only return entries with this prop key.\n              - `propValue` (optional) - Only return entries with a matching prop key and value.\n              - `startDate` (optional) - UTC date (YYYY-MM-DD), ISO 8601 datetime, or millisecond timestamp.\n              - `endDate` (optional) - Same format as `startDate`.\n              - `aliasService` (optional) - Only return entries for this player alias service (e.g. `steam`, `epic`, `username`).\n              - `playerId` (optional) - Only return entries for this player ID.\n\n              The `X-Talo-Include-Dev-Data` header (set to `1`) includes entries belonging to dev players.\n          - info:\n              name: Admin Leaderboards - update entry\n              type: http\n              seq: 4\n            http:\n              method: PATCH\n              url: '{{baseUrl}}/admin/v1/leaderboards/:leaderboardId/entries/:leaderboardEntryId'\n              params:\n                - name: leaderboardId\n                  value: '{{leaderboardId}}'\n                  type: path\n                - name: leaderboardEntryId\n                  value: '{{leaderboardEntryId}}'\n                  type: path\n              body:\n                type: json\n                data: |-\n                  {\n                    \"newScore\": 725.5,\n                    \"hidden\": false\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Update a leaderboard entry.\n\n              **Authentication**\n              - Required scope: `write:leaderboards`.\n\n              **Path**\n              - `{{leaderboardId}}` - The ID of the leaderboard.\n              - `{{leaderboardEntryId}}` - The ID of the leaderboard entry.\n\n              **Body**\n              - `hidden` (optional) - Whether the entry is hidden.\n              - `newScore` (optional) - The new score for the entry.\n          - info:\n              name: Admin Leaderboards - update\n              type: http\n              seq: 5\n            http:\n              method: PUT\n              url: '{{baseUrl}}/admin/v1/leaderboards/:leaderboardId'\n              params:\n                - name: leaderboardId\n                  value: '{{leaderboardId}}'\n                  type: path\n              body:\n                type: json\n                data: |-\n                  {\n                    \"name\": \"Highscores2\",\n                    \"refreshInterval\": \"weekly\"\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Update a leaderboard.\n\n              **Authentication**\n              - Required scope: `write:leaderboards`.\n\n              **Path**\n              - `{{leaderboardId}}` - The ID of the leaderboard.\n\n              **Body**\n              - `name` (optional) - The display name of the leaderboard.\n              - `sortMode` (optional) - How entries are sorted: `asc` or `desc`.\n              - `unique` (optional) - Whether each player can only have a single entry.\n              - `refreshInterval` (optional) - How often the leaderboard resets: `never`, `daily`, `weekly`, `monthly` or `yearly`.\n              - `uniqueByProps` (optional) - Whether entries are unique based on their props.\n          - info:\n              name: Admin Leaderboards - reset\n              type: http\n              seq: 6\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/admin/v1/leaderboards/:leaderboardId/entries'\n              params:\n                - name: leaderboardId\n                  value: '{{leaderboardId}}'\n                  type: path\n                - name: mode\n                  value: all\n                  type: query\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Reset a leaderboard's entries. Optionally filtered to live or dev players.\n\n              **Authentication**\n              - Required scope: `write:leaderboards`.\n\n              **Path**\n              - `{{leaderboardId}}` - The ID of the leaderboard.\n\n              **Query**\n              - `mode` (optional, default `all`) - Which players to reset: `all`, `live` or `dev`.\n          - info:\n              name: Admin Leaderboards - delete\n              type: http\n              seq: 7\n            http:\n              method: DELETE\n              url: '{{baseUrl}}/admin/v1/leaderboards/:leaderboardId'\n              params:\n                - name: leaderboardId\n                  value: '{{leaderboardId}}'\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Delete a leaderboard.\n\n              **Authentication**\n              - Required scope: `write:leaderboards`.\n\n              **Path**\n              - `{{leaderboardId}}` - The ID of the leaderboard.\n      - info:\n          name: Stats\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |\n            Admin endpoints for creating, updating and managing game stats.\n\n            Authenticate with an admin API key that has the `read:stats` and `write:stats` scopes.\n          type: text/markdown\n        items:\n          - info:\n              name: Admin Stats - create\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{baseUrl}}/admin/v1/game-stats'\n              body:\n                type: json\n                data: |-\n                  {\n                    \"internalName\": \"gold-collected\",\n                    \"name\": \"Gold collected\",\n                    \"global\": false,\n                    \"defaultValue\": 0,\n                    \"minTimeBetweenUpdates\": 0.5\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n              forwardAuthorizationHeader: true\n            docs: |-\n              Create a game stat.\n\n              **Authentication**\n              - Required scope: `write:stats`.\n\n              **Body**\n              - `internalName` - The internal name of the stat.\n              - `name` - The display name of the stat.\n              - `global` - Whether the stat value is shared across all players.\n              - `maxChange` (optional) - The maximum allowed change to the stat per update.\n              - `minValue` (optional) - The minimum value the stat can be set to.\n              - `maxValue` (optional) - The maximum value the stat can be set to.\n              - `defaultValue` - The default value for the stat.\n              - `minTimeBetweenUpdates` - The minimum time in seconds between updates.\n          - info:\n              name: Admin Stats - list\n              type: http\n              seq: 2\n            http:\n              method: GET\n              url: '{{baseUrl}}/admin/v1/game-stats'\n              params:\n                - name: withMetrics\n                  value: '1'\n                  type: query\n                  disabled: true\n                - name: metricsStartDate\n                  value: ''\n                  type: query\n                  disabled: true\n                - name: metricsEndDate\n                  value: ''\n                  type: query\n                  disabled: true\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirec
